site_name: "ArcticDense: Neural Book Retriever"
site_description: "Production-grade dense vector book retrieval with Snowflake Arctic Embed (v1.5), contrastive learning, and iterative negative mining."
site_author: Nizam
repo_name: nansari-0134/neural_book_search_arctic
repo_url: https://github.com/nansari-0134/neural_book_search_arctic

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js

nav:
  - Overview: index.md
  - System Architecture: architecture.md
  - Matryoshka Compression (MRL): matryoshka_mrl.md
  - Data Pipeline & Clustering: data_pipeline.md
  - Contrastive Fine-Tuning: fine_tuning.md
  - Iterative Negative Mining: iterative_mining.md
  - Benchmark Progression: benchmarks.md
  - Recall@K Metrics Math: metrics_explanation.md
  - Docker & Cloud Deployment: docker.md

