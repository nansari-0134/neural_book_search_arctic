services:
  arctic-search:
    build:
      context: .
      dockerfile: Dockerfile
    image: arctic-search:cpu
    container_name: arctic_book_search_cpu
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DEVICE=cpu
      - OMP_NUM_THREADS=4
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
